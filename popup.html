<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinkedIn Automation</title>
  <style>
    body { font-family: Arial, sans-serif; width: 280px; padding: 14px; }
    h2 { margin: 0 0 12px; color: #0a66c2; font-size: 18px; }
    label { display: block; margin-top: 10px; font-size: 13px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 48px; }
    .note { font-size: 12px; color: #555; margin-top: 6px; }
    button { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 6px; background: #0a66c2; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { background: #a7a7a7; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; color: #333; }
  </style>
</head>
<body>
  <h2>LinkedIn Auto Actions</h2>

  <label for="likeCount">Like Count</label>
  <input id="likeCount" type="number" min="1" placeholder="e.g. 5" />

  <label for="commentCount">Comment Count</label>
  <input id="commentCount" type="number" min="1" placeholder="e.g. 3" />

  <label for="commentText">Comment Text (default CFBR)</label>
  <textarea id="commentText">CFBR</textarea>
  <div class="note">Button enables only after both counts are > 0.</div>

  <button id="startBtn" disabled>Start</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
